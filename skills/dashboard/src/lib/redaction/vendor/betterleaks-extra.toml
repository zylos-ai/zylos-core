[[rules]]
id = "groq-api-key"
description = "Identified a Groq API Key, which may expose high-speed AI inference services to unauthorized access."
regex = '''(?i)\b(gsk_[A-Z0-9]{52})(?:\\?['"\x60]|[\s;]|\\[nr]|$)'''
confidence = "high"
keywords = ["gsk_"]
validate = '''
let r = http.get("https://api.groq.com/openai/v1/models", {
    "Authorization": "Bearer " + finding["secret"]
  }); r.status == 200 && (r.body contains '"id"') && (r.body contains '"data"') ? {
    "result": "valid"
  } : r.status in [401, 403] ? {
    "result": "invalid",
    "reason": "Unauthorized"
  } : validate.unknown(r)
'''
filter = '''
entropy(finding["secret"]) <= 3.5
'''

